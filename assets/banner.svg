<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <radialGradient id="glowBlue" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" />
    </pattern>

    <!-- Component Filter Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .erp-dash {
        stroke-dasharray: 8, 12;
        animation: dashMove 30s linear infinite;
      }
      .erp-dash-reverse {
        stroke-dasharray: 6, 10;
        animation: dashMoveRev 25s linear infinite;
      }
      .pulse-circle {
        animation: pulseEffect 4s ease-in-out infinite alternate;
      }
      .glow-orb-1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .badge-glow {
        animation: badgePulse 6s ease-in-out infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes dashMoveRev {
        to { stroke-dashoffset: 1000; }
      }
      @keyframes pulseEffect {
        0% { transform: scale(0.98); opacity: 0.6; }
        100% { transform: scale(1.02); opacity: 1; }
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(30px, 20px); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-25px, -15px); }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)" />

  <!-- Background Glowing Orbs (Dynamic) -->
  <circle class="glow-orb-1" cx="240" cy="120" r="220" fill="url(#glowBlue)" />
  <circle class="glow-orb-2" cx="960" cy="280" r="240" fill="url(#glowPurple)" />
  <circle cx="600" cy="380" r="180" fill="url(#glowCyan)" />

  <!-- Tech Matrix Grid -->
  <rect width="1200" height="400" rx="16" fill="url(#grid)" />

  <!-- Dynamic Network Connection Circuit Lines (In Background) -->
  <g opacity="0.35">
    <!-- Horizontal Flow Lines -->
    <path class="erp-dash" d="M -50 80 Q 300 130 600 70 T 1250 100" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="erp-dash-reverse" d="M -50 320 Q 350 260 600 330 T 1250 290" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <path class="erp-dash" d="M -50 200 Q 400 240 750 170 T 1250 220" fill="none" stroke="#3b82f6" stroke-width="1" />
    
    <!-- Flow Nodes -->
    <circle cx="180" cy="98" r="4" fill="#38bdf8" />
    <circle cx="420" cy="105" r="3" fill="#60a5fa" />
    <circle cx="780" cy="82" r="5" fill="#38bdf8" />
    <circle cx="1020" cy="94" r="4" fill="#60a5fa" />

    <circle cx="220" cy="300" r="4" fill="#c084fc" />
    <circle cx="500" cy="300" r="5" fill="#a855f7" />
    <circle cx="850" cy="320" r="4" fill="#c084fc" />
    <circle cx="1060" cy="295" r="3" fill="#a855f7" />
  </g>

  <!-- Surrounding Outer Card Frame -->
  <rect x="2" y="2" width="1196" height="396" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 72)" text-anchor="middle">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="-135" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="2">ENTERPRISE ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Headline -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#textGradient)" letter-spacing="-0.5">
      Awesome Enterprise Resource Planning
    </text>
    <text y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="1">
      ERP PLATFORMS &amp; OPEN-SOURCE FRAMEWORKS
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Subtitle / Description -->
  <g transform="translate(600, 248)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated guide covering Tier-1 SaaS suites, mid-market leaders, and self-hosted open-source software
    </text>
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748b" letter-spacing="0.4">
      Financials • Supply Chain (SCM) • CRM • Manufacturing (MRP) • Human Capital Management (HCM)
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Capability Pillars (Pills) -->
  <g transform="translate(600, 325)" text-anchor="middle" class="badge-glow">
    <!-- Pill 1: SaaS Leaders -->
    <g transform="translate(-360, 0)">
      <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#93c5fd">☁️ Enterprise SaaS Suites</text>
    </g>

    <!-- Pill 2: Open Source -->
    <g transform="translate(-120, 0)">
      <rect x="-115" y="-16" width="230" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">🔓 100% Open-Source Hub</text>
    </g>

    <!-- Pill 3: Self-Hosted -->
    <g transform="translate(120, 0)">
      <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c4b5fd">🛡️ Self-Hosted Sovereignty</text>
    </g>

    <!-- Pill 4: Automation & AI -->
    <g transform="translate(360, 0)">
      <rect x="-115" y="-16" width="230" height="32" rx="16" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#67e8f9">⚡ Process Automation &amp; AI</text>
    </g>
  </g>
</svg>
